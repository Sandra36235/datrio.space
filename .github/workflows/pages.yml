name: Publicar Datrio y demos de estudiantes

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: datrio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: datrio
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: adrianaclaros/DBav
          ref: main
          path: adriana
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Dart675/Coroporacion_ASYNC
          ref: main
          path: antonio
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: keylalopez1007/basesdedatos
          ref: main
          path: keyla
          persist-credentials: false
        continue-on-error: true
      - uses: actions/checkout@v4
        with:
          repository: natalyovando1/basededatos1
          ref: main
          path: nataly
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: vegafernandezariana1-del/Cineuphoria
          ref: main
          path: ariana
          persist-credentials: false
      - name: Preparar sitio y demostracion
        run: |
          mkdir public
          rsync -a --exclude='.git' --exclude='.github' --exclude='scripts' datrio/ public/
          python3 datrio/scripts/build-adriana-demo.py adriana/frontend public
          python3 datrio/scripts/build-async-demo.py antonio/frontend public
          if [ -d keyla/frontend ]; then
            python3 datrio/scripts/build-animal-hospital-demo.py keyla/frontend public
          else
            wget --quiet --recursive --level=2 --page-requisites --convert-links --adjust-extension --no-parent --no-host-directories --directory-prefix=public https://datrio.space/animal-hospital-anomaly/
          fi
          python3 datrio/scripts/build-nativas-burgers-demo.py nataly/frontend public
          cat datrio/eufrates-final.zip.* > /tmp/eufrates-final.zip
          mkdir /tmp/eufrates-final
          unzip -q /tmp/eufrates-final.zip -d /tmp/eufrates-final
          python3 datrio/scripts/build-eufrates-tigris-demo.py /tmp/eufrates-final public
          python3 datrio/scripts/build-cineuphoria-demo.py ariana/frontend public
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
