<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbf6ec">
<title>Un rincón de Datrio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&display=swap">
<link rel="stylesheet" href="datrio-pages.css?v=2">
<link rel="icon" href="datrio-mark.svg">
</head>
<body>
<header class="page-top">
 <a class="page-logo" href="index.html#salon" aria-label="Datrio, volver al salón"><img src="datrio-mark.svg" alt=""><span>datrio</span></a>
 <a class="pill" id="back" href="index.html#salon"><span>←</span> Volver al salón</a>
</header>
<main>
 <section class="page-hero">
  <div>
   <div class="eyebrow">Un rincón de mi universo</div>
   <h1 id="title">Pasa.</h1>
   <p id="intro"></p>
  </div>
  <div class="hero-art"><img src="art/card-salon.webp" alt="El salón de Datrio en 3D, con el sofá burgundy y Puyol" width="640" height="440"></div>
 </section>
 <section class="block" id="content"></section>
</main>
<footer class="page-foot"><span>Hecho de curiosidad, café y conexiones.</span><span>datrio / un universo en construcción</span></footer>
<script>
const params=new URLSearchParams(location.search);
const pages={
 coffee:{name:'Café & matcha',intro:'Un lugar para preparar una pausa y dejar que aparezcan nuevas ideas.'},
 music:{name:'Mi música',intro:'Canciones, ukulele y el espacio que dejo para escuchar.'},
 dog:{name:'Mi compañero',intro:'Un rincón para mi poodle, coqueto y siempre cerca.'},
 work:{name:'Datos & marketing',intro:'Aquí tomarán forma mis proyectos de análisis, datos y marketing.'},
 board:{name:'Docencia',intro:'Un espacio para las ideas que nacen cuando enseñamos y aprendemos.'},
 tech:{name:'Mi setup tech',intro:'Apps, desarrollo y herramientas: el lado más tech de mi universo.'},
 chess:{name:'El ajedrez de las ideas',intro:'Una jugada para cada iniciativa, proyecto y pregunta nueva.'}
};
const key=Object.hasOwn(pages,params.get('zona'))?params.get('zona'):'work';
const page=pages[key];
document.title=page.name+' · Datrio';
// The last word of the title goes in burgundy italics, like every Datrio heading.
const words=page.name.split(' '),last=words.pop();
const title=document.getElementById('title');title.textContent=words.join(' ')+' ';
const em=document.createElement('em');em.textContent=last+'.';title.append(em);
document.getElementById('intro').textContent=page.intro;
const from=params.get('desde')==='estudio'?'estudio':'salon';
for(const link of document.querySelectorAll('header a'))link.href='index.html#'+from;
const card=(tag,icon,h,p,link)=>`<${link?'a':'article'} class="card${link?'':' static'}"${link?` href="${link.href}"${link.ext?' target="_blank" rel="noopener noreferrer"':''}`:''}><div class="card-top"><span class="tag">${tag}</span><span class="card-icon" aria-hidden="true">${icon}</span></div><h3>${h}</h3><p>${p}</p>${link?`<span class="pill dark">${link.label} <span>↗</span></span>`:'<span class="who">Más detalles pronto</span>'}</${link?'a':'article'}>`;
const head=(n,h)=>`<div class="section-head"><div><div class="eyebrow">${n}</div><h2>${h}</h2></div></div>`;
const content=document.getElementById('content');
if(key==='tech'){
 content.innerHTML=head('01 / Apps personales','Lo que <em>construyo</em>')+'<div class="cards">'+
  card('App personal','✿','El <em>árbol</em>','Uno de mis desarrollos personales. Su repositorio es privado.')+
  card('App personal','☺','eusebi<em>OS</em>','Aplicación de gestión anti-estrés con una experiencia visual propia. Su repositorio es privado.')+
  card('App personal','◇','<em>Kurtos</em>','Aplicación de ventas con un personalizador 3D paso a paso.',{href:'https://github.com/Sandra36235/kurtosapp',ext:1,label:'Ver repositorio'})+
  '</div>'+head('02 / Mi tablero','Mis <em>herramientas</em>')+
  '<div class="chip-groups"><div><b>Business intelligence</b><div class="chips"><span>Power BI</span><span>SQL</span><span>Excel</span><span>Python</span><span>Microsoft Fabric</span><span>Snowflake</span></div></div><div><b>Desarrollo</b><div class="chips"><span>Django</span><span>JavaScript</span><span>HTML / CSS</span></div></div><div><b>Experiencias 3D</b><div class="chips"><span>Three.js</span></div></div></div>';
}else if(key==='chess'){
 content.innerHTML=head('01 / Próximas jugadas','Ideas en el <em>tablero</em>')+'<div class="cards">'+
  card('Idea','✳','<em>Datrio</em>','Un espacio para compartir datos, ideas y lo que nace en el aula.',{href:'https://datrio.space/',ext:1,label:'Visitar Datrio'})+
  card('Formación','✎','Datrio <em>Academy</em>','Capacitaciones y cursos a medida para seguir aprendiendo.',{href:'biblioteca.html#contact-title',label:'Conversemos'})+
  card('BI','▥','Proyectos de <em>BI</em>','Aquí irán mis casos y tableros de business intelligence.')+
  '</div>';
}else content.innerHTML='<div class="soon"><span class="card-icon" aria-hidden="true">✳</span><div><h2>Este rincón está tomando forma.</h2><p>Pronto habrá más historias aquí. Mientras tanto, puedes volver a recorrer el salón.</p><a class="text-link" href="index.html#'+from+'">Volver al salón →</a></div></div>';
</script>
</body>
</html>
